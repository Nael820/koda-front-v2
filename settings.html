<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda — Réglages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-white min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="w-full relative flex items-center justify-between px-5" style="background:#F1D9C8; height: 60px;">
    <div class="flex items-center z-10">
      <a href="#">
        <img src="img/assets/loop.png" alt="recherche" class="w-6 h-6 object-contain" />
      </a>
    </div>
    <span class="absolute left-1/2 -translate-x-1/2" style="font-family: 'Rammetto One', cursive; color: #255B54; font-size: 20px;">RÉGLAGES</span>
    <div class="flex items-center gap-4 z-10">
      <a href="settings.html">
        <img src="img/assets/param.png" alt="paramètres" class="w-6 h-6 object-contain" />
      </a>
    </div>
  </header>

  <!-- CONTENU -->
  <main class="flex-1 px-5 pt-6 pb-32">

    <!-- Bannière + Avatar -->
    <div class="relative mb-12">
      <div class="w-full h-28 rounded-2xl overflow-hidden" style="background:#e8cebb;">
        <img id="banner-preview" src="" alt="bannière" class="w-full h-full object-cover hidden" />
      </div>
      <label for="input-banner" class="absolute bottom-2 right-2 w-8 h-8 rounded-full flex items-center justify-center cursor-pointer" style="background:#2D241F;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </label>
      <input type="file" id="input-banner" accept="image/*" class="hidden" />

      <div class="absolute -bottom-8 left-1/2 -translate-x-1/2">
        <div class="relative">
          <div class="w-16 h-16 rounded-full border-4 border-white overflow-hidden" style="background:#d4b9a8;">
            <img id="avatar-preview" src="" alt="avatar" class="w-full h-full object-cover hidden" />
          </div>
          <label for="input-avatar" class="absolute bottom-0 right-0 w-6 h-6 rounded-full flex items-center justify-center cursor-pointer" style="background:#2D241F;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
          </label>
          <input type="file" id="input-avatar" accept="image/*" class="hidden" />
        </div>
      </div>
    </div>

    <!-- Mon compte -->
    <p class="text-xs font-semibold tracking-widest mb-3" style="color:#7a6255;">MON COMPTE</p>

    <label class="text-xs font-semibold tracking-widest mb-1 block" style="color:#2D241F;">PRÉNOM</label>
    <input id="input-firstname" type="text" placeholder="Ton prénom"
      class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-4 outline-none focus:border-[#B4C8C5] transition-colors" />

    <label class="text-xs font-semibold tracking-widest mb-1 block" style="color:#2D241F;">NOM</label>
    <input id="input-lastname" type="text" placeholder="Ton nom"
      class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-4 outline-none focus:border-[#B4C8C5] transition-colors" />

    <label class="text-xs font-semibold tracking-widest mb-1 block" style="color:#2D241F;">PSEUDO</label>
    <input id="input-username" type="text" placeholder="Ton pseudo"
      class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-4 outline-none focus:border-[#B4C8C5] transition-colors" />

    <label class="text-xs font-semibold tracking-widest mb-1 block" style="color:#2D241F;">EMAIL</label>
    <input id="input-mail" type="email" placeholder="Ton email"
      class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-6 outline-none focus:border-[#B4C8C5] transition-colors" />

    <!-- Biographie -->
    <p class="text-xs font-semibold tracking-widest mb-3 mt-2" style="color:#7a6255;">MA BIOGRAPHIE</p>

    <div class="relative mb-6">
      <textarea id="input-bio" placeholder="Parle de toi en quelques mots..." maxlength="1000"
        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-[#B4C8C5] transition-colors resize-none h-32"></textarea>
      <span id="bio-count" class="absolute bottom-3 right-4 text-xs" style="color:#7a6255;">0/1000</span>
    </div>

    <!-- Tags -->
    <p class="text-xs font-semibold tracking-widest mb-3" style="color:#7a6255;">MES ACTIVITÉS</p>
    <p class="text-xs mb-4" style="color:#7a6255;">Sélectionne jusqu'à 5 activités qui te représentent</p>

    <div id="tags-container" class="flex flex-wrap gap-2 mb-6">
      <!-- tags générés par JS -->
    </div>

    <!-- Sécurité -->
    <p class="text-xs font-semibold tracking-widest mb-3" style="color:#7a6255;">SÉCURITÉ</p>

    <label class="text-xs font-semibold tracking-widest mb-1 block" style="color:#2D241F;">NOUVEAU MOT DE PASSE</label>
    <input id="input-password" type="password" placeholder="Laisser vide pour ne pas changer"
      class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-4 outline-none focus:border-[#B4C8C5] transition-colors" />

    <label class="text-xs font-semibold tracking-widest mb-1 block" style="color:#2D241F;">CONFIRMER LE MOT DE PASSE</label>
    <input id="input-password-confirm" type="password" placeholder="••••••••••"
      class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-8 outline-none focus:border-[#B4C8C5] transition-colors" />

    <button id="btn-save"
      class="w-full py-4 rounded-2xl font-bold tracking-wide text-sm mb-3 border border-[#2D241F] text-[#2D241F] bg-transparent hover:bg-gray-50 transition-colors">
      ENREGISTRER
    </button>

    <button id="btn-delete"
      class="w-full py-4 rounded-2xl font-bold tracking-wide text-sm border text-[#A50329] bg-transparent hover:bg-red-50 transition-colors" style="border-color:#A50329;">
      SUPPRIMER MON COMPTE
    </button>

    <a href="profil.html"
      class="w-full py-4 rounded-2xl font-bold tracking-wide text-sm border border-[#2D241F] text-[#2D241F] bg-transparent hover:bg-gray-50 transition-colors text-center block mt-3">
      RETOUR AU PROFIL
    </a>

    <p id="msg" class="text-xs text-center mt-4 min-h-5" style="color:#255B54;"></p>

  </main>

  <!-- FOOTER FIXE -->
  <footer class="fixed bottom-0 left-0 right-0 flex items-end justify-around px-4 pb-4 pt-2 max-w-md mx-auto" style="background: linear-gradient(to top, #F1D9C8 70%, transparent);">

    <a href="groupe.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/groupe.png" alt="groupes" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="blog.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/book.png" alt="blog" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="index.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/home.png" alt="accueil" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="custom.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/pate.png" alt="mascotte" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="profil.html" class="flex flex-col items-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:#d4b9a8;">
        <img src="img/assets/user.png" alt="profil" class="w-9 h-9 object-contain" />
      </div>
    </a>

  </footer>

  <script type="module">
    import { getToken, apiRequest } from "./js/api.js";
    import { deleteAccount } from "./js/auth.js";

    const API_URL = "http://localhost:3000";

    if (!getToken()) window.location.href = "login.html";

    const msg = document.getElementById("msg");

    const ALL_TAGS = [
      "Alimentation", "Course à pied", "Cyclisme", "Musculation", "Yoga",
      "Natation", "Football", "Basketball", "Tennis", "Randonnée",
      "Crossfit", "Pilates", "Arts martiaux", "Escalade", "Ski",
      "Surf", "Boxe", "Danse", "Stretching", "Méditation",
      "Triathlon", "Rugby", "Volleyball", "Badminton", "Padel"
    ];

    let selectedTags = [];

    function renderTags() {
      const container = document.getElementById("tags-container");
      container.innerHTML = ALL_TAGS.map(tag => {
        const isSelected = selectedTags.includes(tag);
        return `
          <button type="button" data-tag="${tag}"
            class="px-3 py-1.5 rounded-full text-xs font-semibold border transition-colors"
            style="${isSelected
              ? 'background:#2D241F; color:#F1D9C8; border-color:#2D241F;'
              : 'background:#f7f7f7; color:#2D241F; border-color:#e8e8e8;'}">
            ${tag}
          </button>`;
      }).join("");

      container.querySelectorAll("button[data-tag]").forEach(btn => {
        btn.addEventListener("click", () => {
          const tag = btn.dataset.tag;
          if (selectedTags.includes(tag)) {
            selectedTags = selectedTags.filter(t => t !== tag);
          } else {
            if (selectedTags.length >= 5) {
              msg.style.color = "#A50329";
              msg.textContent = "Maximum 5 activités.";
              setTimeout(() => msg.textContent = "", 2000);
              return;
            }
            selectedTags.push(tag);
          }
          renderTags();
        });
      });
    }

    // Compteur bio
    document.getElementById("input-bio").addEventListener("input", (e) => {
      document.getElementById("bio-count").textContent = `${e.target.value.length}/1000`;
    });

    // Charge les infos actuelles
    async function loadUser() {
      const user = await apiRequest("/users/me");
      document.getElementById("input-firstname").value = user.firstname ?? "";
      document.getElementById("input-lastname").value = user.lastname ?? "";
      document.getElementById("input-username").value = user.username;
      document.getElementById("input-mail").value = user.mail;

      if (user.bio) {
        document.getElementById("input-bio").value = user.bio;
        document.getElementById("bio-count").textContent = `${user.bio.length}/1000`;
      }

      if (user.tags) {
        try { selectedTags = JSON.parse(user.tags); } catch (_) { selectedTags = []; }
      }
      renderTags();

      if (user.avatar) {
        const img = document.getElementById("avatar-preview");
        img.src = `${API_URL}${user.avatar}`;
        img.classList.remove("hidden");
      }
      if (user.banner) {
        const img = document.getElementById("banner-preview");
        img.src = `${API_URL}${user.banner}`;
        img.classList.remove("hidden");
      }
    }

    renderTags();

    // Preview avatar
    document.getElementById("input-avatar").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = document.getElementById("avatar-preview");
      img.src = URL.createObjectURL(file);
      img.classList.remove("hidden");
    });

    // Preview bannière
    document.getElementById("input-banner").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = document.getElementById("banner-preview");
      img.src = URL.createObjectURL(file);
      img.classList.remove("hidden");
    });

    // Upload fichier
    async function uploadFile(endpoint, file) {
      const formData = new FormData();
      formData.append("file", file);
      const response = await fetch(`${API_URL}${endpoint}`, {
        method: "PATCH",
        headers: { Authorization: `Bearer ${getToken()}` },
        body: formData,
      });
      if (!response.ok) throw new Error("Erreur upload");
      return response.json();
    }

    // Enregistrer
    document.getElementById("btn-save").addEventListener("click", async () => {
      const username = document.getElementById("input-username").value.trim();
      const mail = document.getElementById("input-mail").value.trim();
      const password = document.getElementById("input-password").value;
      const passwordConfirm = document.getElementById("input-password-confirm").value;
      msg.textContent = "";
      msg.style.color = "#255B54";

      if (password && password !== passwordConfirm) {
        msg.style.color = "#A50329";
        msg.textContent = "Les mots de passe ne correspondent pas.";
        return;
      }

      try {
        const firstname = document.getElementById("input-firstname").value.trim();
        const lastname = document.getElementById("input-lastname").value.trim();
        const bio = document.getElementById("input-bio").value.trim();

        // Mise à jour pseudo/email/bio/tags/prénom/nom
        await apiRequest("/users/me", {
          method: "PATCH",
          body: JSON.stringify({ username, mail, bio, tags: JSON.stringify(selectedTags), firstname, lastname }),
        });

        // Mise à jour mot de passe
        if (password) {
          await apiRequest("/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({ userId: null, newPassword: password }),
          });
        }

        // Upload avatar
        const avatarFile = document.getElementById("input-avatar").files[0];
        if (avatarFile) await uploadFile("/users/me/avatar", avatarFile);

        // Upload bannière
        const bannerFile = document.getElementById("input-banner").files[0];
        if (bannerFile) await uploadFile("/users/me/banner", bannerFile);

        msg.textContent = "Modifications enregistrées !";
      } catch (e) {
        msg.style.color = "#A50329";
        msg.textContent = e.message || "Une erreur est survenue.";
      }
    });

    // Supprimer le compte
    document.getElementById("btn-delete").addEventListener("click", async () => {
      if (!confirm("Supprimer définitivement ce compte ?")) return;
      await deleteAccount();
      window.location.href = "login.html";
    });

    loadUser();
  </script>

</body>
</html>
