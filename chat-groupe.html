<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .msg-other { background: #F1D9C8; border-radius: 4px 16px 16px 16px; }
    .msg-me { background: #e8e0d8; border-radius: 16px 4px 16px 16px; }
    #messages-container { scroll-behavior: smooth; }
  </style>
</head>
<body class="min-h-screen flex flex-col" style="background:#faf6f2;">

  <!-- HEADER -->
  <header class="w-full flex items-center justify-between px-4" style="background:#F1D9C8; height: 60px;">
    <div class="flex items-center gap-2">
      <a href="groupe.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D241F" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl cursor-pointer" style="background:#2D241F;" id="btn-group-name">
        <span id="group-name" class="font-bold text-sm" style="color:#F1D9C8;">Chargement...</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F1D9C8" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <a href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D241F" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/>
        </svg>
      </a>
      <a href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#255B54" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- MESSAGES -->
  <main id="messages-container" class="flex-1 overflow-y-auto px-4 py-4 pb-24">
    <div id="messages-list" class="flex flex-col gap-4">
      <p class="text-xs text-center" style="color:#7a6255;">Chargement des messages...</p>
    </div>
  </main>

  <!-- BARRE D'ENVOI -->
  <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-3 py-3" style="background:#2D241F;">
    <div class="flex items-center gap-2">
      <button class="flex-shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1D9C8" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <input id="msg-input" type="text" placeholder="Votre message..."
        class="flex-1 px-4 py-2.5 rounded-xl text-sm outline-none"
        style="background:#3d322c; color:#F1D9C8; border:none;" />
      <button class="flex-shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1D9C8" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="flex-shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1D9C8" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </button>
      <button id="btn-send" class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center" style="background:#A50329;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { getToken, apiRequest } from "./js/api.js";

    const API_URL = "http://localhost:3000";

    if (!getToken()) window.location.href = "login.html";

    const groupId = window.location.hash.replace("#", "");
    if (!groupId) window.location.href = "groupe.html";

    let currentUser = null;
    let messages = []; // stockage local des messages

    // Charge les infos du groupe
    async function loadGroup() {
      try {
        const group = await apiRequest(`/groups/group/${groupId}`);
        document.getElementById("group-name").textContent = group.name;
      } catch (_) {}
    }

    // Charge l'utilisateur connecté
    async function loadCurrentUser() {
      currentUser = await apiRequest("/users/me");
    }

    function renderMessages() {
      const container = document.getElementById("messages-list");

      if (!messages.length) {
        container.innerHTML = `<p class="text-xs text-center" style="color:#7a6255;">Aucun message pour l'instant. Dis bonjour ! 👋</p>`;
        return;
      }

      container.innerHTML = messages.map(msg => {
        const isMe = msg.senderId === currentUser?.id;

        if (isMe) {
          return `
            <div class="flex justify-end">
              <div class="max-w-xs px-4 py-2.5 msg-me">
                <p class="text-sm" style="color:#2D241F;">${msg.text}</p>
                <p class="text-xs mt-1 text-right" style="color:#7a6255;">${formatTime(msg.time)}</p>
              </div>
            </div>`;
        } else {
          return `
            <div class="flex items-end gap-2">
              <div class="w-8 h-8 rounded-full flex-shrink-0 overflow-hidden" style="background:#e8cebb;">
                ${msg.senderAvatar ? `<img src="${API_URL}${msg.senderAvatar}" class="w-full h-full object-cover" />` : ''}
              </div>
              <div class="max-w-xs">
                <p class="text-xs mb-1 font-semibold" style="color:#7a6255;">${msg.senderName}</p>
                <div class="px-4 py-2.5 msg-other">
                  <p class="text-sm" style="color:#2D241F;">${msg.text}</p>
                  <p class="text-xs mt-1" style="color:#7a6255;">${formatTime(msg.time)}</p>
                </div>
              </div>
            </div>`;
        }
      }).join("");

      // Scroll vers le bas
      const main = document.getElementById("messages-container");
      main.scrollTop = main.scrollHeight;
    }

    function formatTime(time) {
      return new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" }).format(new Date(time));
    }

    // Envoi d'un message
    document.getElementById("btn-send").addEventListener("click", sendMessage);
    document.getElementById("msg-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !currentUser) return;

      messages.push({
        senderId: currentUser.id,
        senderName: currentUser.username,
        senderAvatar: currentUser.avatar,
        text,
        time: new Date().toISOString(),
      });

      input.value = "";
      renderMessages();
    }

    async function init() {
      await loadCurrentUser();
      await loadGroup();
      renderMessages();

      document.getElementById("btn-group-name").addEventListener("click", () => {
        window.location.href = `groupe-settings.html#${groupId}`;
      });
    }

    init();
  </script>

</body>
</html>
