<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda — Défi du jour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col" style="background:#fff;">

  <!-- HEADER -->
  <header class="w-full flex items-center justify-between px-4" style="background:#F1D9C8; height: 60px;">
    <a href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D241F" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <span style="font-family:'Rammetto One',cursive; color:#255B54; font-size:16px;">DÉFI DU JOUR</span>
    <div class="w-6"></div>
  </header>

  <!-- CONTENU -->
  <main class="flex-1 px-5 pt-6 pb-10">

    <!-- Titre -->
    <div class="inline-block px-4 py-2 mb-4" style="background:#255B54; border-radius: 16px 16px 16px 0;">
      <span id="dm-title" style="font-family:'Rammetto One',cursive; color:#fff; font-size:14px;">Chargement...</span>
    </div>

    <!-- Image -->
    <div class="rounded-2xl overflow-hidden mb-5">
      <img src="img/fond.jpg" class="w-full h-44 object-cover" alt="défi du jour" />
    </div>

    <!-- Description -->
    <p id="dm-description" class="text-sm mb-6 leading-relaxed" style="color:#2D241F;"></p>

    <!-- Bloc saisie des pas -->
    <div id="dm-steps-section" class="rounded-2xl p-4" style="background:#F1D9C8;">
      <!-- contenu généré dynamiquement -->
    </div>

  </main>

  <script type="module">
    import { getToken, apiRequest } from "./js/api.js";

    if (!getToken()) window.location.href = "login.html";

    async function load() {
      try {
        const dm = await apiRequest("/tasks/daily-mission/today");

        if (!dm) {
          document.getElementById("dm-title").textContent = "Aucun défi aujourd'hui";
          document.getElementById("dm-description").textContent = "Reviens plus tard pour découvrir le prochain défi !";
          document.getElementById("dm-steps-section").classList.add("hidden");
          return;
        }

        document.getElementById("dm-title").textContent = dm.title;
        document.getElementById("dm-description").textContent = dm.description;

        const stepsSection = document.getElementById("dm-steps-section");

        if (dm.steps !== null) {
          stepsSection.innerHTML = `
            <p class="text-xs mb-2" style="color:#7a6255;">Objectif : ${dm.targetSteps} pas</p>
            <p class="text-sm font-semibold" style="color:${dm.validated ? '#255B54' : '#A50329'};">
              ${dm.validated ? '✓ Mission réussie !' : '✕ Objectif non atteint'} — ${dm.steps} / ${dm.targetSteps} pas
            </p>`;
        } else {
          stepsSection.innerHTML = `
            <p class="text-xs mb-3" style="color:#7a6255;">Objectif : ${dm.targetSteps} pas</p>
            <div class="flex gap-2">
              <input id="steps-input" type="number" placeholder="Nombre de pas"
                class="flex-1 px-4 py-3 rounded-xl text-sm outline-none"
                style="background:#fff; border:1px solid #e8e8e8; color:#2D241F;" />
              <button id="btn-submit-steps" class="px-4 py-3 rounded-xl font-bold text-sm" style="background:#255B54; color:#fff;">
                Valider
              </button>
            </div>
            <p id="steps-error" class="text-xs mt-2" style="color:#A50329;"></p>`;

          document.getElementById("btn-submit-steps").addEventListener("click", async () => {
            const steps = document.getElementById("steps-input").value;
            const errorEl = document.getElementById("steps-error");
            if (!steps || Number(steps) < 0) {
              errorEl.textContent = "Entre un nombre de pas valide.";
              return;
            }
            try {
              await apiRequest(`/tasks/${dm.id}/submit-steps`, {
                method: "POST",
                body: JSON.stringify({ steps: Number(steps) }),
              });
              load();
            } catch (e) {
              errorEl.textContent = e.message || "Erreur lors de l'envoi.";
            }
          });
        }
      } catch (e) {
        document.getElementById("dm-title").textContent = "Erreur";
        document.getElementById("dm-description").textContent = e.message || "Une erreur est survenue.";
      }
    }

    load();
  </script>

</body>
</html>
