<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda — Missions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col" style="background:#fff;">

  <!-- HEADER -->
  <header class="w-full flex items-center justify-between px-4" style="background:#F1D9C8; height: 60px;">
    <a id="btn-back" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D241F" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <span id="group-name-header" style="font-family:'Rammetto One',cursive; color:#255B54; font-size:18px;">MISSIONS</span>
    <div class="w-6"></div>
  </header>

  <!-- CONTENU -->
  <main class="flex-1 px-5 pt-6 pb-32">

    <!-- Bouton créer -->
    <button id="btn-create-mission"
      class="w-full py-4 rounded-2xl font-bold text-sm tracking-wide mb-8"
      style="background:#255B54; color:#fff; font-family:'Rammetto One',cursive;">
      CRÉER NOS PROPRES MISSIONS
    </button>

    <!-- Classement -->
    <p class="text-xs font-semibold tracking-widest mb-4" style="color:#7a6255;">CLASSEMENT</p>
    <div id="ranking-list" class="mb-8"></div>

    <!-- Missions -->
    <p class="text-xs font-semibold tracking-widest mb-4" style="color:#7a6255;">MISSIONS DU GROUPE</p>
    <div id="missions-list">
      <p class="text-sm" style="color:#7a6255;">Chargement...</p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="fixed bottom-0 left-0 right-0 flex items-end justify-around px-4 pb-4 pt-2 max-w-md mx-auto" style="background: linear-gradient(to top, #F1D9C8 70%, transparent);">
    <a href="groupe.html" class="flex flex-col items-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:#d4b9a8;">
        <img src="img/assets/groupe.png" alt="groupes" class="w-9 h-9 object-contain" />
      </div>
    </a>
    <a href="blog.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/book.png" alt="blog" class="w-7 h-7 object-contain" />
      </div>
    </a>
    <a href="index.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/home.png" alt="accueil" class="w-7 h-7 object-contain" />
      </div>
    </a>
    <a href="custom.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/pate.png" alt="mascotte" class="w-7 h-7 object-contain" />
      </div>
    </a>
    <a href="profil.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/user.png" alt="profil" class="w-7 h-7 object-contain" />
      </div>
    </a>
  </footer>

  <script type="module">
    import { getToken, apiRequest } from "./js/api.js";

    const API_URL = "http://localhost:3000";
    if (!getToken()) window.location.href = "login.html";

    const groupId = window.location.hash.replace("#", "");
    if (!groupId) window.location.href = "groupe.html";

    document.getElementById("btn-back").href = `chat-groupe.html#${groupId}`;

    document.getElementById("btn-create-mission").addEventListener("click", () => {
      window.location.href = `create-mission.html#${groupId}`;
    });

    async function load() {
      try {
        const [missions, group] = await Promise.all([
          apiRequest(`/tasks/group/${groupId}`),
          apiRequest(`/groups/group/${groupId}`),
        ]);

        document.getElementById("group-name-header").textContent = group.name.toUpperCase();

        // --- CLASSEMENT ---
        const userStats = {};
        for (const m of missions) {
          for (const p of m.participants) {
            if (!userStats[p.userId]) {
              userStats[p.userId] = { id: p.userId, username: p.username, avatar: p.avatar ?? null, validated: 0, failed: 0, points: 0 };
            }
            if (p.validated) userStats[p.userId].validated++;
          }
        }

        const ranking = Object.values(userStats).sort((a, b) => b.validated - a.validated);
        const rankingContainer = document.getElementById("ranking-list");

        if (!ranking.length) {
          rankingContainer.innerHTML = `<p class="text-sm" style="color:#7a6255;">Aucun participant pour l'instant.</p>`;
        } else {
          rankingContainer.innerHTML = `<div style="margin: 0 -20px;">` + ranking.map((u, i) => `
            <div class="flex items-center gap-3 px-5 py-3 border-b border-gray-200" style="background:#F1D9C8;">
              <div class="relative flex-shrink-0" style="padding-top: 10px;">
                <div class="absolute left-1/2 -translate-x-1/2 -top-0 w-5 h-5 rounded-full flex items-center justify-center text-white font-bold z-10" style="background:#A50329; font-size:10px;">
                  ${i + 1}
                </div>
                <div class="w-14 h-14 rounded-2xl overflow-hidden border-4" style="border-color:#A50329;">
                  ${u.avatar ? `<img src="http://localhost:3000${u.avatar}" class="w-full h-full object-cover" />` : '<div class="w-full h-full" style="background:#e8cebb;"></div>'}
                </div>
              </div>
              <div class="flex-1">
                <p class="font-bold text-sm mb-2" style="color:#2D241F;">${u.username}</p>
                <div class="flex gap-2 flex-wrap">
                  <span class="px-2 py-1 rounded-lg text-xs font-semibold" style="background:#fff; color:#2D241F;">✓ ${u.validated} réussis</span>
                  <span class="px-2 py-1 rounded-lg text-xs font-semibold" style="background:#fff; color:#2D241F;">✕ ${u.failed} ratés</span>
                  <span class="px-2 py-1 rounded-lg text-xs font-semibold" style="background:#fff; color:#2D241F;">★ ${u.points} pts</span>
                </div>
              </div>
              <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 cursor-pointer" style="background:#2D241F;" onclick="window.location.href='userprofil.html#${u.id}'">
                <img src="img/arrow_right.png" style="width:16px; height:16px; object-fit:contain;" alt=">" />
              </div>
            </div>
          `).join("") + `</div>`;
        }

        // --- MISSIONS ---
        const missionsContainer = document.getElementById("missions-list");
        if (!missions.length) {
          missionsContainer.innerHTML = `<p class="text-sm" style="color:#7a6255;">Aucune mission pour l'instant.</p>`;
          return;
        }

        // Déduplique les missions par id
        const seenIds = new Set();
        const uniqueMissions = missions.filter(m => {
          if (seenIds.has(m.id)) return false;
          seenIds.add(m.id);
          return true;
        });

        // Récupère l'utilisateur connecté pour la redirection
        let currentUser = null;
        try { currentUser = await apiRequest("/users/me"); } catch (_) {}

        missionsContainer.innerHTML = uniqueMissions.map(m => {
          const dayMap = { 'Lundi': 'L', 'Mardi': 'Mar', 'Mercredi': 'Mer', 'Jeudi': 'J', 'Vendredi': 'V', 'Samedi': 'S', 'Dimanche': 'D' };
          let dayLabel = '';
          if (m.frequency) {
            try {
              const days = JSON.parse(m.frequency);
              dayLabel = days.map(d => dayMap[d] || d).join('');
            } catch { dayLabel = ''; }
          }

          const userId = currentUser?.id ?? '';

          return `
            <div class="flex items-center justify-between px-4 py-3 rounded-2xl mb-3 cursor-pointer"
              style="background:#255B54;"
              onclick="window.location.href='mission-detail.html#${m.id}-${userId}'">
              <p class="font-bold text-sm" style="color:#fff;">${m.title}</p>
              ${dayLabel ? `<span class="px-3 py-1 rounded-xl text-xs font-bold flex-shrink-0 ml-3" style="background:#B4C8C5; color:#fff;">${dayLabel}</span>` : ''}
            </div>`;
        }).join("");

      } catch (e) {
        document.getElementById("missions-list").innerHTML = `<p class="text-sm" style="color:#A50329;">Erreur : ${e.message}</p>`;
      }
    }

    load();
  </script>

</body>
</html>
