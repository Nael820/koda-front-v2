<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-white min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="w-full relative flex items-center justify-between px-5 pt-4 pb-0" style="background:#F1D9C8; height: 90px;">
    <div class="flex items-center gap-4 z-10">
      <a href="profil.html">
        <img src="img/assets/user.png" alt="profil" class="w-6 h-6 object-contain" />
      </a>
      <a href="#">
        <img src="img/assets/loop.png" alt="recherche" class="w-6 h-6 object-contain" />
      </a>
    </div>
    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 flex items-end justify-center">
      <img src="img/mascotte_entete.png" alt="mascotte" class="h-20 object-contain" />
    </div>
    <div class="flex items-center z-10">
      <a href="notifications.html" class="relative">
        <img src="img/assets/bell.png" alt="notifications" class="w-6 h-6 object-contain" />
      </a>
    </div>
  </header>

  <!-- CONTENU -->
  <main class="flex-1 px-5 pt-6 pb-32">

    <p class="text-xs font-semibold tracking-widest mb-5" style="color:#7a6255;">DEMANDES D'AMIS</p>

    <div id="pending-list">
      <p class="text-sm" style="color:#7a6255;">Chargement...</p>
    </div>

  </main>

  <!-- FOOTER FIXE -->
  <footer class="fixed bottom-0 left-0 right-0 flex items-end justify-around px-4 pb-4 pt-2 max-w-md mx-auto" style="background: linear-gradient(to top, #F1D9C8 70%, transparent);">

    <a href="groupe.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/groupe.png" alt="groupes" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="blog.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/book.png" alt="blog" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="index.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/home.png" alt="accueil" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="custom.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/pate.png" alt="mascotte" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="profil.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/user.png" alt="profil" class="w-7 h-7 object-contain" />
      </div>
    </a>

  </footer>

  <script type="module">
    import { getToken, apiRequest } from "./js/api.js";

    const API_URL = "http://localhost:3000";

    if (!getToken()) window.location.href = "login.html";

    async function loadPending() {
      const container = document.getElementById("pending-list");
      try {
        const pending = await apiRequest("/friends/pending");

        if (!pending.length) {
          container.innerHTML = `<p class="text-sm" style="color:#7a6255;">Aucune demande en attente.</p>`;
          return;
        }

        container.innerHTML = pending.map(f => `
          <div id="notif-${f.requester.id}" class="flex items-center justify-between py-4 border-b border-gray-100">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0" style="background:#e8cebb;">
                ${f.requester.avatar ? `<img src="${API_URL}${f.requester.avatar}" class="w-full h-full object-cover" />` : ''}
              </div>
              <div>
                <p class="font-semibold text-sm" style="color:#2D241F;">@${f.requester.username}</p>
                ${f.requester.firstname || f.requester.lastname
                  ? `<p class="text-xs" style="color:#7a6255;">${f.requester.firstname ?? ''} ${f.requester.lastname ?? ''}</p>`
                  : ''}
                <p class="text-xs mt-0.5" style="color:#7a6255;">Veut être ton ami</p>
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="acceptRequest(${f.requester.id}, this)"
                class="px-3 py-2 rounded-xl text-xs font-bold transition-colors"
                style="background:#255B54; color:#fff;">
                ✓
              </button>
              <button onclick="declineRequest(${f.requester.id}, this)"
                class="px-3 py-2 rounded-xl text-xs font-bold border transition-colors"
                style="border-color:#A50329; color:#A50329;">
                ✕
              </button>
            </div>
          </div>
        `).join("");
      } catch (e) {
        container.innerHTML = `<p class="text-sm" style="color:#A50329;">Erreur : ${e.message}</p>`;
      }
    }

    // Accepter
    window.acceptRequest = async (userId, btn) => {
      try {
        await apiRequest(`/friends/accept/${userId}`, { method: "POST" });
        const row = document.getElementById(`notif-${userId}`);
        row.innerHTML = `
          <div class="flex items-center gap-3 py-2">
            <p class="text-sm font-semibold" style="color:#255B54;">✓ Demande acceptée !</p>
          </div>`;
        setTimeout(() => row.remove(), 2000);
      } catch (e) {
        btn.textContent = "Erreur";
      }
    };

    // Refuser
    window.declineRequest = async (userId, btn) => {
      try {
        await apiRequest(`/friends/decline/${userId}`, { method: "POST" });
        const row = document.getElementById(`notif-${userId}`);
        row.innerHTML = `
          <div class="flex items-center gap-3 py-2">
            <p class="text-sm" style="color:#7a6255;">Demande refusée.</p>
          </div>`;
        setTimeout(() => row.remove(), 2000);
      } catch (e) {
        btn.textContent = "Erreur";
      }
    };

    loadPending();
  </script>

</body>
</html>
