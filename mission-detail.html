<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda — Détail mission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .day-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .day-circle.validated {
      background: #fff;
    }
    .day-circle.not-validated {
      background: #2D241F;
    }
    .day-circle.future {
      background: transparent;
      border: 1.5px solid #ccc;
    }
    .pate-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col" style="background:#fff;">

  <!-- HEADER -->
  <header class="w-full flex items-center justify-between px-4" style="background:#F1D9C8; height: 60px;">
    <a href="javascript:history.back()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D241F" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <span id="mission-title" style="font-family:'Rammetto One',cursive; color:#255B54; font-size:16px;">MISSION</span>
    <div class="w-6"></div>
  </header>

  <!-- CONTENU -->
  <main class="flex-1 px-5 pt-6 pb-32">

    <!-- Titre série -->
    <div class="px-4 py-3 mb-6 inline-block" style="background:#255B54; border-radius: 16px 16px 16px 0;">
      <span style="font-family:'Rammetto One',cursive; color:#fff; font-size:14px;">MA SÉRIE DE RÉUSSITES</span>
    </div>

    <!-- Calendrier -->
    <div id="calendar" class="mb-8"></div>

    <!-- Message jours depuis début -->
    <div class="flex items-center gap-3 p-4">
      <img src="img/mascotte_progression.png" class="h-16 object-contain flex-shrink-0" alt="mascotte" />
      <p id="days-message" class="font-bold text-sm" style="color:#2D241F;"></p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="fixed bottom-0 left-0 right-0 flex items-end justify-around px-4 pb-4 pt-2 max-w-md mx-auto" style="background: linear-gradient(to top, #F1D9C8 70%, transparent);">
    <a href="groupe.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/groupe.png" alt="groupes" class="w-7 h-7 object-contain" />
      </div>
    </a>
    <a href="blog.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/book.png" alt="blog" class="w-7 h-7 object-contain" />
      </div>
    </a>
    <a href="index.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/home.png" alt="accueil" class="w-7 h-7 object-contain" />
      </div>
    </a>
    <a href="custom.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/pate.png" alt="mascotte" class="w-7 h-7 object-contain" />
      </div>
    </a>
    <a href="profil.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/user.png" alt="profil" class="w-7 h-7 object-contain" />
      </div>
    </a>
  </footer>

  <script type="module">
    import { getToken, apiRequest } from "./js/api.js";

    if (!getToken()) window.location.href = "login.html";

    // hash format: #taskId-userId
    const hash = window.location.hash.replace("#", "");
    const [taskId, userId] = hash.split("-");

    if (!taskId || !userId) window.location.href = "groupe.html";

    const DAY_LABELS = ['D', 'L', 'Mar', 'Mer', 'J', 'V', 'S'];
    const DAY_LABELS_FULL = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

    function formatDateFR(dateStr) {
      return new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" }).format(new Date(dateStr));
    }

    function renderCalendar(days, frequency) {
      const container = document.getElementById("calendar");
      if (!days.length) {
        container.innerHTML = `<p class="text-sm" style="color:#7a6255;">Aucun jour à afficher.</p>`;
        return;
      }

      // Groupe les jours par semaine (ligne de 7 = L M M J V S D)
      // Récupère les jours de la fréquence
      const dayMapFR = { 'Lundi': 1, 'Mardi': 2, 'Mercredi': 3, 'Jeudi': 4, 'Vendredi': 5, 'Samedi': 6, 'Dimanche': 0 };
      let scheduledDayNumbers = [];
      if (frequency) {
        try {
          const freq = JSON.parse(frequency);
          scheduledDayNumbers = freq.map(d => dayMapFR[d]);
        } catch {}
      }

      // En-têtes des jours programmés
      const dayNames = scheduledDayNumbers.length
        ? scheduledDayNumbers.map(n => DAY_LABELS_FULL[n])
        : DAY_LABELS_FULL;

      // Regroupe par semaines de 7 colonnes max
      // On affiche les jours dans l'ordre chronologique, 7 par ligne
      const chunkSize = dayNames.length;
      const chunks = [];
      for (let i = 0; i < days.length; i += chunkSize) {
        chunks.push(days.slice(i, i + chunkSize));
      }

      const today = new Date().toISOString().split('T')[0];

      container.innerHTML = `
        <div style="background:#F1D9C8; border-radius:20px; padding:20px;">
          <p id="period-text" class="font-bold text-base mb-4" style="color:#2D241F;"></p>
          <div class="grid mb-3" style="grid-template-columns: repeat(${dayNames.length}, 1fr); gap:8px;">
            ${dayNames.map(d => `<div class="text-center text-sm font-bold" style="color:#2D241F;">${d}</div>`).join("")}
          </div>
          ${chunks.map(chunk => `
            <div class="grid mb-3" style="grid-template-columns: repeat(${dayNames.length}, 1fr); gap:8px;">
              ${chunk.map(day => {
                const isFuture = day.date > today;
                const dateNum = new Date(day.date).getDate().toString().padStart(2, '0');
                const monthNum = (new Date(day.date).getMonth() + 1).toString().padStart(2, '0');
                if (isFuture) {
                  return `
                    <div class="day-cell">
                      <div class="day-circle future"></div>
                      <span class="text-xs" style="color:#2D241F;">${dateNum}/${monthNum}</span>
                    </div>`;
                } else if (day.validated) {
                  return `
                    <div class="day-cell">
                      <div class="day-circle validated">
                        <img src="img/assets/pate_2.png" class="pate-img" alt="✓" />
                      </div>
                      <span class="text-xs" style="color:#2D241F;">${dateNum}/${monthNum}</span>
                    </div>`;
                } else {
                  return `
                    <div class="day-cell">
                      <div class="day-circle not-validated"></div>
                      <span class="text-xs" style="color:#2D241F;">${dateNum}/${monthNum}</span>
                    </div>`;
                }
              }).join("")}
            </div>
          `).join("")}
        </div>`;
    }

    async function load() {
      try {
        const data = await apiRequest(`/task-validation/mission/${taskId}/user/${userId}/history`);

        document.getElementById("mission-title").textContent = data.title?.toUpperCase() ?? "MISSION";

        // Calendrier
        renderCalendar(data.days, data.frequency);

        // Période (insérée dans le calendrier après rendu)
        const start = formatDateFR(data.startDate);
        const end = data.endDate ? formatDateFR(data.endDate) : "aujourd'hui";
        const periodEl = document.getElementById("period-text");
        if (periodEl) periodEl.textContent = `Du ${start} au ${end}`;

        // Message
        const msg = document.getElementById("days-message");
        msg.textContent = `Ça fait maintenant ${data.daysSinceStart} jour${data.daysSinceStart > 1 ? 's' : ''} que cette mission a commencé — ${data.totalValidated} jour${data.totalValidated > 1 ? 's' : ''} validé${data.totalValidated > 1 ? 's' : ''} !`;

      } catch (e) {
        console.error(e);
      }
    }

    load();
  </script>

</body>
</html>
