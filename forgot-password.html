<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda — Mot de passe oublié</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-white min-h-screen flex flex-col">

  <img src="img/trace.png" class="fixed top-0 right-0 w-64 pointer-events-none opacity-10" alt="" />
  <img src="img/bottle.png" class="fixed bottom-0 left-0 w-64 pointer-events-none opacity-10" alt="" />

  <div class="relative z-10 flex flex-col flex-1 px-7 pt-14 pb-10 max-w-md w-full mx-auto">

    <a href="login.html" class="flex items-center gap-2 text-sm mb-10" style="color:#7a6255">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Retour
    </a>

    <h1 class="text-3xl mb-2" style="font-family: 'Rammetto One', cursive; color: #2D241F; line-height:1.2">Mot de passe<br>oublié ?</h1>
    <p class="text-sm mb-10" style="color:#7a6255">Entre ton email pour retrouver ton compte</p>

    <!-- Étape 1 : saisie email -->
    <div id="step-email">
      <label class="text-xs font-semibold tracking-widest mb-2 block" style="color:#2D241F">EMAIL</label>
      <input id="email" type="email" placeholder="Ton email"
        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-6 outline-none focus:border-[#B4C8C5] transition-colors" />

      <button id="btn-find"
        class="w-full py-4 rounded-2xl font-bold tracking-wide text-sm border border-[#2D241F] text-[#2D241F] bg-transparent hover:bg-gray-50 active:bg-gray-100 transition-colors">
        TROUVER MON COMPTE
      </button>
    </div>

    <!-- Étape 2 : compte trouvé, reset mdp -->
    <div id="step-reset" class="hidden">
      <div class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-4 mb-6">
        <p class="text-xs font-semibold tracking-widest mb-1" style="color:#7a6255">COMPTE TROUVÉ</p>
        <p id="found-username" class="font-bold text-lg" style="color:#2D241F"></p>
      </div>

      <label class="text-xs font-semibold tracking-widest mb-2 block" style="color:#2D241F">NOUVEAU MOT DE PASSE</label>
      <input id="new-password" type="password" placeholder="••••••••••"
        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-4 outline-none focus:border-[#B4C8C5] transition-colors" />

      <label class="text-xs font-semibold tracking-widest mb-2 block" style="color:#2D241F">CONFIRMER LE MOT DE PASSE</label>
      <input id="confirm-password" type="password" placeholder="••••••••••"
        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm mb-6 outline-none focus:border-[#B4C8C5] transition-colors" />

      <button id="btn-reset"
        class="w-full py-4 rounded-2xl font-bold tracking-wide text-sm border border-[#2D241F] text-[#2D241F] bg-transparent hover:bg-gray-50 active:bg-gray-100 transition-colors">
        RÉINITIALISER
      </button>
    </div>

    <!-- Étape 3 : succès -->
    <div id="step-success" class="hidden flex flex-col items-center text-center pt-8">
      <p class="text-4xl mb-4">✅</p>
      <p class="font-bold text-lg mb-2" style="color:#2D241F">Mot de passe modifié !</p>
      <p class="text-sm mb-8" style="color:#7a6255">Tu peux maintenant te connecter avec ton nouveau mot de passe.</p>
      <a href="login.html"
        class="w-full py-4 rounded-2xl font-bold tracking-wide text-sm border border-[#2D241F] text-[#2D241F] text-center hover:bg-gray-50 transition-colors">
        SE CONNECTER
      </a>
    </div>

    <p id="error-msg" class="text-xs text-center mt-4 min-h-5" style="color:#A50329"></p>

  </div>

  <script type="module">
    import { apiRequest } from "./js/api.js";

    const errorMsg = document.getElementById("error-msg");
    let foundUserId = null;

    // Étape 1 — trouver le compte par email
    document.getElementById("btn-find").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      errorMsg.textContent = "";

      if (!email) {
        errorMsg.textContent = "Entre ton email.";
        return;
      }

      const btn = document.getElementById("btn-find");
      btn.textContent = "Recherche...";
      btn.disabled = true;

      try {
        const user = await apiRequest("/auth/find-by-email", {
          method: "POST",
          body: JSON.stringify({ mail: email }),
        });

        foundUserId = user.id;
        document.getElementById("found-username").textContent = "@" + user.username;
        document.getElementById("step-email").classList.add("hidden");
        document.getElementById("step-reset").classList.remove("hidden");
      } catch (e) {
        errorMsg.textContent = "Aucun compte trouvé avec cet email.";
      } finally {
        btn.textContent = "TROUVER MON COMPTE";
        btn.disabled = false;
      }
    });

    // Étape 2 — réinitialiser le mot de passe
    document.getElementById("btn-reset").addEventListener("click", async () => {
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      errorMsg.textContent = "";

      if (!newPassword || !confirmPassword) {
        errorMsg.textContent = "Remplis tous les champs.";
        return;
      }

      if (newPassword !== confirmPassword) {
        errorMsg.textContent = "Les mots de passe ne correspondent pas.";
        return;
      }

      const btn = document.getElementById("btn-reset");
      btn.textContent = "Réinitialisation...";
      btn.disabled = true;

      try {
        await apiRequest("/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({ userId: foundUserId, newPassword }),
        });

        document.getElementById("step-reset").classList.add("hidden");
        document.getElementById("step-success").classList.remove("hidden");
      } catch (e) {
        errorMsg.textContent = e.message || "Une erreur est survenue.";
      } finally {
        btn.textContent = "RÉINITIALISER";
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
