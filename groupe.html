<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda — Groupes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-white min-h-screen flex flex-col">

  <!-- HEADER (identique à index) -->
  <header class="w-full relative flex items-center justify-between px-5 pt-4 pb-0" style="background:#F1D9C8; height: 90px;">
    <div class="flex items-center gap-4 z-10">
      <a href="profil.html">
        <img src="img/assets/user.png" alt="profil" class="w-6 h-6 object-contain" />
      </a>
      <a href="#">
        <img src="img/assets/loop.png" alt="recherche" class="w-6 h-6 object-contain" />
      </a>
    </div>

    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 flex items-end justify-center">
      <img src="img/mascotte_entete.png" alt="mascotte" class="h-20 object-contain" />
    </div>

    <div class="flex items-center z-10">
      <a href="notifications.html" class="relative">
        <img src="img/assets/bell.png" alt="notifications" class="w-6 h-6 object-contain" />
        <span id="notif-count" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full text-white text-xs flex items-center justify-center" style="background:#A50329; font-size:9px;"></span>
      </a>
    </div>
  </header>

  <!-- CONTENU -->
  <main class="flex-1 px-5 pt-6 pb-32">

    <!-- Boutons principaux -->
    <div class="flex gap-3 mb-8">
      <button id="btn-create-group"
        class="flex-1 py-4 rounded-2xl font-bold text-sm tracking-wide transition-colors"
        style="background:#B4C8C5; color:#2D241F; font-family: 'Rammetto One', cursive;">
        CRÉER UN GROUPE
      </button>
      <button id="btn-mes-amis"
        class="flex-1 py-4 rounded-2xl font-bold text-sm tracking-wide transition-colors"
        style="background:#B4C8C5; color:#2D241F; font-family: 'Rammetto One', cursive;">
        MES AMIS
      </button>
    </div>

    <!-- Contenu groupes -->
    <div id="groups-list"></div>

  </main>

  <!-- FOOTER FIXE (groupe actif) -->
  <footer class="fixed bottom-0 left-0 right-0 flex items-end justify-around px-4 pb-4 pt-2 max-w-md mx-auto" style="background: linear-gradient(to top, #F1D9C8 70%, transparent);">

    <a href="groupe.html" class="flex flex-col items-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:#d4b9a8;">
        <img src="img/assets/groupe.png" alt="groupes" class="w-9 h-9 object-contain" />
      </div>
    </a>

    <a href="blog.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/book.png" alt="blog" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="index.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/home.png" alt="accueil" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="custom.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/pate.png" alt="mascotte" class="w-7 h-7 object-contain" />
      </div>
    </a>

    <a href="profil.html" class="flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#e8cebb;">
        <img src="img/assets/user.png" alt="profil" class="w-7 h-7 object-contain" />
      </div>
    </a>

  </footer>

  <script type="module">
    import { getToken, apiRequest } from "./js/api.js";
    import { loadNotifBadge } from "./js/notif-badge.js";

    if (!getToken()) window.location.href = "login.html";

    document.getElementById("btn-create-group").addEventListener("click", () => {
      window.location.href = "create-groupe.html";
    });

    document.getElementById("btn-mes-amis").addEventListener("click", () => {
      window.location.href = "amis.html";
    });

    async function loadGroups() {
      const container = document.getElementById("groups-list");
      try {
        const groups = await apiRequest("/groups/allUserGroups");

        if (!groups.length) {
          container.innerHTML = `<p class="text-sm text-center mt-8" style="color:#7a6255;">Tu ne fais partie d'aucun groupe pour l'instant.</p>`;
          return;
        }

        let currentUser = null;
        try { currentUser = await apiRequest("/users/me"); } catch (_) {}

        // Récupère le dernier message de chaque groupe
        const groupsWithLastMessage = await Promise.all(groups.map(async (g) => {
          let lastMessage = null;
          try {
            const messages = await apiRequest(`/chat/${g.id}`);
            if (messages.length) lastMessage = messages[messages.length - 1];
          } catch (_) {}
          return { ...g, lastMessage };
        }));

        container.innerHTML = `<div style="margin: 0 -20px;">` + groupsWithLastMessage.map(g => {
          let previewText = "Aucun message pour l'instant";
          if (g.lastMessage) {
            const senderName = g.lastMessage.user?.username ?? '';
            if (g.lastMessage.imageUrl) {
              previewText = `${senderName} a envoyé une photo`;
            } else if (g.lastMessage.message) {
              previewText = `${senderName} : ${g.lastMessage.message}`;
            }
          }

          return `
          <div onclick="window.location.href='chat-groupe.html#${g.id}'"
            class="flex items-center gap-3 px-5 py-3 border-b border-gray-200 cursor-pointer" style="background:#F1D9C8;">
            <div class="w-14 h-14 rounded-2xl flex-shrink-0 overflow-hidden flex items-center justify-center font-bold text-lg"
              style="background:#e8cebb; color:#2D241F;">
              ${g.imageUrl ? `<img src="http://localhost:3000${g.imageUrl}" class="w-full h-full object-cover" />` : g.name.charAt(0).toUpperCase()}
            </div>
            <div class="flex-1 min-w-0 flex flex-col gap-1.5">
              <div class="px-3 py-1.5 inline-block" style="background:#fff; width:fit-content; max-width:100%; border-radius: 12px 12px 12px 0;">
                <p class="font-bold text-sm truncate" style="color:#2D241F;">${g.name}</p>
              </div>
              <div class="px-3 py-1.5" style="background:#fff; border-radius: 0 12px 12px 12px;">
                <p class="text-xs truncate" style="color:#7a6255;">${previewText}</p>
              </div>
            </div>
          </div>`;
        }).join("") + `</div>`;
      } catch (e) {
        container.innerHTML = `<p class="text-sm text-center mt-8" style="color:#A50329;">Erreur de chargement.</p>`;
      }
    }

    loadGroups();
    loadNotifBadge();
  </script>

</body>
</html>
